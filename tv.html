<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16131F">
<meta name="robots" content="noindex">
<title>Household Names · TV</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body class="tv">
<div id="offline" class="offline hide">Reconnecting…</div>
<div id="stage" class="stage"></div>
<script src="rules.js"></script>
<script src="common.js"></script>
<script>
(function () {
  'use strict';
  var G = window.Game, R = window.Rules, $ = G.$, esc = G.esc;
  var stage = $('#stage');
  var host = G.store.get('hn.tv', null);            // { code, token, blob } so the same room comes back after a refresh or a restart
  var S = null, seenWon = {}, lastPhaseKey = '', lastTickSec = -1;

  var conn = G.connect({
    hello: function () { return host ? { t: 'tv', code: host.code, token: host.token, blob: host.blob } : { t: 'tv' }; },
    onStatus: function (up) { $('#offline').classList.toggle('hide', up); },
    onMessage: function (m) {
      if (m.t === 'hosting') { if (!host || host.code !== m.code) host = { code: m.code, token: m.token }; G.store.set('hn.tv', host); return; }
      if (m.t === 'backup') { if (host && host.code === m.code) { host.blob = m.blob; G.store.set('hn.tv', host); } return; }
      if (m.t === 'state') { S = m; G.sync(m); return draw(); }
      if (m.t === 'nope' && m.msg) return G.toast(m.msg);
      if (m.t === 'fx') return fx(m);
    }
  });
  G.stayAwake();

  function fx(m) {
    var s = G.sound;
    if (m.k === 'got') s.got(); else if (m.k === 'skip') s.skip(); else if (m.k === 'undo') s.undo();
    else if (m.k === 'start') s.start(); else if (m.k === 'time') s.time(); else if (m.k === 'join') s.join();
    else if (m.k === 'round' || m.k === 'roundEnd') s.round();
    else if (m.k === 'over') { s.over(); setTimeout(function () { G.confetti(); }, 300); }
  }
  function act(m) { conn.send(m); }
  function team(id) { return S.teams.filter(function (t) { return t.id === id; })[0] || { name: '', players: [] }; }
  function joinUrl() { return location.origin + '/?code=' + S.code; }

  function draw() {
    var views = { lobby: lobby, intro: intro, ready: ready, turn: turn, recap: recap, roundEnd: board, over: board };
    var key = S.phase + '|' + (S.round || 0) + '|' + (S.turn ? S.turn.giver : '');
    if (S.phase !== 'turn') seenWon = {};
    stage.innerHTML = top() + (views[S.phase] || lobby)();
    stage.classList.toggle('fresh', key !== lastPhaseKey);
    lastPhaseKey = key;
    tick();
  }
  function top() {
    var inGame = S.phase !== 'lobby';
    return '<div class="top">' + G.logo() + '<div class="top-right">' +
      (inGame ? '<div class="join-pill">Join at ' + esc(location.host) + ' <b>' + esc(S.code) + '</b></div>' : '') +
      (inGame ? '<button class="btn ghost small tv-btn" data-act="end">End game</button>' : '<button class="btn ghost small tv-btn" data-act="newroom">New room</button>') +
      '<button class="btn ghost small tv-btn" data-act="mute">' + (G.sound.muted() ? 'Sound off' : 'Sound on') + '</button></div></div>';
  }
  function setting(key) {
    var v = S.settings[key], titles = { rating: 'Deck', cards: 'Deck size', timer: 'Turn clock', rounds: 'Rounds', teams: 'Teams' };
    return '<button class="setting' + (key === 'rating' && v === 'dark' ? ' dark' : '') + '" data-act="set" data-key="' + key + '"><b>' + titles[key] + '</b><span>' + esc(R.label(key, v)) + '</span></button>';
  }
  function lobby() {
    var cols = S.teams.map(function (t) {
      return '<div class="team-col" style="' + G.teamStyle(t.id) + '"><h2>' + esc(t.name) + '</h2><div class="names">' +
        (t.players.map(function (p) { return '<button class="name' + (p.on ? '' : ' off') + (p.id === S.captainId ? ' cap' : '') + '" data-act="kick" data-id="' + p.id + '" data-name="' + esc(p.name) + '">' + esc(p.name) + '</button>'; }).join('') || '<span class="empty">Waiting for players…</span>') +
        '</div></div>';
    }).join('');
    return '<div class="main lobby"><div class="join-card"><div class="eyebrow">Scan to join</div>' +
      '<img alt="QR code to join" src="/qr.svg?u=' + encodeURIComponent(joinUrl()) + '">' +
      '<div class="join-url">' + esc(location.host) + '</div><div class="eyebrow">Game code</div><div class="join-code">' + esc(S.code) + '</div></div>' +
      '<div class="lobby-right"><div class="teams">' + cols + '</div>' +
      '<div class="lobby-foot">' + ['rating', 'teams', 'cards', 'timer', 'rounds'].map(setting).join('') +
      '<button class="btn small" data-act="shuffle">Shuffle teams</button><span class="spacer"></span>' +
      '<span class="hint">' + esc(S.startError || G.plural(S.count, 'player') + ' in. Ready when you are.') + '</span>' +
      '<button class="btn primary start-btn" data-act="start"' + (S.startError ? ' disabled' : '') + '>Start</button></div></div></div>';
  }
  function intro() {
    var t = S.turn;
    return '<div class="main intro"><div>' + G.roundCard(S.round, S.rounds) +
      '<div class="upnext">' + (S.round > 1 ? 'Same cards as last round. ' : '') + 'First up: <b>' + esc(t.giverName) + '</b> for <span class="team-tag" style="' + G.teamStyle(t.team) + '">' + esc(team(t.team).name) + '</span></div>' +
      '<div class="board-btns" style="margin-top:1.4em"><button class="btn primary" data-act="next">Let’s go</button></div></div></div>';
  }
  function ruleStrip() { var r = R.ROUNDS[S.round - 1]; return '<div class="rule-strip"><b>Round ' + S.round + ' · ' + esc(r.name) + '</b>' + esc(r.short) + '</div>'; }
  function ready() {
    var t = S.turn;
    return '<div class="main ready"><div><span class="team-tag" style="' + G.teamStyle(t.team) + '">' + esc(team(t.team).name) + '</span>' +
      '<div class="ready-name">' + esc(t.giverName) + '</div><div class="ready-sub">You are up. Press start on your phone when your team is ready.</div>' + ruleStrip() +
      '<div class="board-btns" style="margin-top:1.6em"><button class="btn small" data-act="go">Start the clock from here</button><button class="btn ghost small" data-act="pass">Pass to a teammate</button></div></div></div>';
  }
  function rail() {
    var cur = S.turn ? S.turn.team : -1;
    return '<div class="rail"><div class="round-chip">Round ' + S.round + ' of ' + S.rounds + '</div>' + S.teams.map(function (t) {
      return '<div class="score-row' + (t.id === cur ? ' up' : '') + '" style="' + G.teamStyle(t.id) + '"><span>' + esc(t.name) + '</span><span class="n">' + t.score + '</span></div>';
    }).join('') + '<div class="deck-box"><b>' + S.pileCount + '</b><span>' + (S.pileCount === 1 ? 'card' : 'cards') + ' left in the deck</span></div></div>';
  }
  function wonChips(list, track) {
    return list.map(function (c) {
      var isNew = track && !seenWon[c.id]; if (track) seenWon[c.id] = 1;
      return G.chip(c).replace('class="chip"', 'class="chip' + (isNew ? ' new' : '') + '"');
    }).join('');
  }
  function turn() {
    var t = S.turn;
    return '<div class="main turn"><div class="ring-wrap"><div class="ring" id="ring"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/><circle class="fill" id="ringFill" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg><div class="ring-num" id="ringNum"></div></div>' +
      '<button class="btn small" data-act="' + (t.paused ? 'resume' : 'pause') + '">' + (t.paused ? 'Resume' : 'Pause') + '</button></div>' +
      '<div class="turn-mid"><div class="turn-who"><span class="team-tag" style="' + G.teamStyle(t.team) + '">' + esc(team(t.team).name) + '</span><b>' + esc(t.giverName) + ' is giving clues</b></div>' + ruleStrip() +
      '<div class="won">' + (t.won.length ? wonChips(t.won, true) : '<div class="won-empty">Guessed names land here.</div>') + '</div></div>' + rail() + '</div>';
  }
  function recap() {
    var L = S.last || { won: [], giverName: '', team: 0 }, t = S.turn, pts = G.points(L.won);
    return '<div class="main recap"><div class="recap-main"><div class="recap-title">Time!</div>' +
      '<div class="recap-line"><b>' + esc(L.giverName) + '</b> got ' + G.plural(L.won.length, 'card') + ' for <span class="team-tag" style="' + G.teamStyle(L.team) + '">' + esc(team(L.team).name) + '</span> <b>+' + pts + '</b></div>' +
      '<div class="won">' + wonChips(L.won) + '</div>' +
      '<div class="recap-line">Up next: <b>' + esc(t.giverName) + '</b> for <span class="team-tag" style="' + G.teamStyle(t.team) + '">' + esc(team(t.team).name) + '</span></div>' +
      '<div><button class="btn primary" data-act="next">Next turn</button></div></div>' + rail() + '</div>';
  }
  function board() {
    var over = S.phase === 'over', order = S.teams.slice().sort(function (a, b) { return b.score - a.score; });
    var head = '<tr><th>Team</th>' + S.roundScores.map(function (r, i) { return '<th>' + esc(R.ROUNDS[i].name) + '</th>'; }).join('') + '<th>Total</th></tr>';
    var rows = order.map(function (t) {
      return '<tr class="' + (over && S.winners.indexOf(t.id) >= 0 ? 'win' : '') + '" style="' + G.teamStyle(t.id) + '"><td>' + esc(t.name) + '</td>' +
        S.roundScores.map(function (r) { return '<td>' + (r[t.id] || 0) + '</td>'; }).join('') + '<td>' + t.score + '</td></tr>';
    }).join('');
    var title, sub, btns;
    if (over) {
      var names = S.teams.filter(function (t) { return S.winners.indexOf(t.id) >= 0; }).map(function (t) { return t.name; });
      title = '<div class="crown">' + (names.length > 1 ? 'It is a tie' : 'Winner') + '</div><div class="board-title">' + esc(names.join(' & ')) + '</div>';
      sub = ''; btns = '<button class="btn primary" data-act="again">Play again</button>';
    } else {
      var L = S.last;
      title = '<div class="board-title">Round ' + S.round + ' is done</div>';
      sub = '<div class="board-sub">' + (L ? esc(L.giverName) + ' cleared the deck. ' : '') + 'Next: Round ' + (S.round + 1) + ', ' + esc(R.ROUNDS[S.round].name) + '. Same cards, tougher rules.</div>';
      btns = '<button class="btn primary" data-act="next">Start round ' + (S.round + 1) + '</button>';
    }
    var awards = over && S.awards && S.awards.length ? '<div class="awards">' + S.awards.map(function (a, i) { return '<div class="award" style="animation-delay:' + (0.3 + i * 0.25) + 's"><b>' + esc(a.title) + '</b><span>' + esc(a.who) + '</span><small>' + esc(a.detail) + '</small></div>'; }).join('') + '</div>' : '';
    return '<div class="main board"><div class="board-in">' + title + sub + '<table class="sheet-t">' + head + rows + '</table>' + awards + '<div class="board-btns">' + btns + '</div></div></div>';
  }

  /* -------------------------------------------------------------- clock */
  function tick() {
    var num = $('#ringNum'); if (!num || !S || !S.turn) return;
    var t = S.turn, left = G.msLeft(t), total = S.timerSec * 1000, sec = Math.ceil(left / 1000), ring = $('#ring');
    num.textContent = t.paused ? 'PAUSED' : sec;
    $('#ringFill').setAttribute('stroke-dashoffset', (326.7 * (1 - Math.max(0, Math.min(1, left / total)))).toFixed(1));
    var low = sec <= 10 && !t.paused;
    ring.classList.toggle('low', low); ring.classList.toggle('paused', !!t.paused);
    if (low && sec !== lastTickSec && sec > 0) G.sound.tick();
    lastTickSec = sec;
  }
  setInterval(tick, 100);

  /* ------------------------------------------------------------- actions */
  function primary() {
    if (!S) return;
    if (S.phase === 'lobby') { if (!S.startError) act({ t: 'start' }); }
    else if (S.phase === 'intro' || S.phase === 'recap' || S.phase === 'roundEnd') act({ t: 'next' });
    else if (S.phase === 'turn') act({ t: S.turn.paused ? 'resume' : 'pause' });
    else if (S.phase === 'over') act({ t: 'again' });
  }
  stage.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'mute') { G.sound.toggle(); return draw(); }
    if (a === 'newroom') return G.ask('Open a new room?', 'This closes the current room and gives you a new code.', 'New room', function () { G.store.del('hn.tv'); location.reload(); });
    if (a === 'end') return G.ask('End this game?', 'Everyone goes back to the lobby and the scores are cleared.', 'End the game', function () { act({ t: 'end' }); });
    if (a === 'kick') { var id = b.getAttribute('data-id'); return G.ask('Remove ' + b.getAttribute('data-name') + '?', 'They can join again with the code.', 'Remove', function () { act({ t: 'kick', id: id }); }); }
    if (a === 'set') {
      var key = b.getAttribute('data-key'), list = R.CHOICES[key];
      return act({ t: 'set', key: key, value: list[(list.indexOf(S.settings[key]) + 1) % list.length] });
    }
    act({ t: a });
  });
  document.addEventListener('keydown', function (e) {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (document.querySelector('.sheet-wrap')) return;
    if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); primary(); }
    if (e.key === 'm' || e.key === 'M') { G.sound.toggle(); if (S) draw(); }
  });
})();
</script>
</body>
</html>
